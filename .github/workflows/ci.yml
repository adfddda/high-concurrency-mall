name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # 集成测试直接打真实中间件：MySQL / Redis / RabbitMQ。
    # 不 mock、不 H2、不 embedded-redis——测的就是真实行为。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "123456"
          MYSQL_DATABASE: mall_trade_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=20s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

      rabbitmq:
        image: rabbitmq:3.13-management
        env:
          RABBITMQ_DEFAULT_USER: mall
          RABBITMQ_DEFAULT_PASS: "mall123456"
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run test suite
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "3306"
          TEST_DB_NAME: mall_trade_test
          TEST_DB_USER: root
          TEST_DB_PASSWORD: "123456"
          TEST_REDIS_HOST: 127.0.0.1
          TEST_REDIS_PORT: "6379"
          TEST_RABBIT_HOST: 127.0.0.1
          TEST_RABBIT_PORT: "5672"
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: high-concurrency-mall:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image is runnable
        run: |
          docker run --rm --entrypoint sh high-concurrency-mall:ci -c 'test -f /app/app.jar && echo "jar ok"'

  gateway:
    name: Gateway Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 网关是独立部署单元，有自己的 pom，因此单独构建。
      # 这条 job 同时也是一道"版本兼容性"的守门人：
      # Spring Cloud 与 Spring Boot 的版本矩阵一旦不匹配，这里会立刻红。
      - name: Build & test gateway
        run: mvn -B -ntp -f gateway/pom.xml verify

      - name: Docker build gateway image
        run: docker build -t mall-gateway:ci ./gateway
