# ============================================================================
#  docker：配合 docker-compose.yml
#  容器内运行时 DB_HOST/REDIS_HOST/RABBIT_HOST 由 compose 注入为 service name；
#  在宿主机运行时它们回落到 localhost + compose 暴露的映射端口
#  （MySQL 3307 / Redis 6380 / RabbitMQ 5672）。
# ============================================================================
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:mall_trade}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&useAffectedRows=true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
  sql:
    init:
      # compose 的 MySQL 首次启动会通过 docker-entrypoint-initdb.d 建表，
      # 这里再跑一次也是幂等的，只是为了让空库场景也能自愈。
      mode: always
      schema-locations: classpath:db/01-schema.sql
      data-locations: classpath:db/02-data.sql
      continue-on-error: false
