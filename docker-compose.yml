# ==========================================================================
# 高并发商城交易系统 —— 基础设施编排
#
#   docker compose up -d                     只起中间件（MySQL/Redis/RabbitMQ）
#   docker compose --profile full up -d --build   中间件 + 应用一起起
#
# 宿主机端口刻意错开默认值（3307 / 6380），避免和开发者本机已装的
# MySQL(3306)、Redis(6379) 冲突。容器内仍使用标准端口。
# ==========================================================================
name: high-concurrency-mall

services:
  mysql:
    image: mysql:8.0
    container_name: mall-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: mall_trade
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
      - --max_connections=1000
      # 关掉 binlog 之外的隐式提交开销；生产按需开启
      - --innodb_flush_log_at_trx_commit=2
    volumes:
      - mysql-data:/var/lib/mysql
      # 01-schema.sql / 02-data.sql 按文件名顺序自动执行
      - ./src/main/resources/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2-alpine
    container_name: mall-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: mall-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: mall
      RABBITMQ_DEFAULT_PASS: mall123456
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  jaeger:
    profiles: ["full"]
    image: jaegertracing/all-in-one:1.62
    container_name: mall-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP over HTTP（应用通过它上报 span）

  # 商品搜索。单节点、关闭安全插件，只为本地演示。
  elasticsearch:
    profiles: ["full"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: mall-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data

  app:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mall-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started
      elasticsearch:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # 容器内走 service name + 标准端口
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: mall_trade
      DB_USER: root
      DB_PASSWORD: root123456
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: "5672"
      RABBIT_USER: mall
      RABBIT_PASSWORD: mall123456
      # 链路追踪：上报到同网络内的 jaeger
      OTEL_ENABLED: "true"
      OTEL_ENDPOINT: http://jaeger:4318/v1/traces
      TRACING_SAMPLE_RATE: "1.0"
      # 搜索走容器内的 elasticsearch；连不上会自动降级到数据库
      SEARCH_ENABLED: "true"
      SEARCH_ENDPOINT: http://elasticsearch:9200
      JAVA_OPTS: "-XX:MaxRAMPercentage=75 -XX:+UseZGC"
    ports:
      - "8080:8080"

  # --------------------------------------------------------------------------
  #  API 网关（独立部署单元）
  #  对外只暴露 8081，业务服务不再直接对公网开放。
  #  限流下沉到这里：每 IP 每窗口 N 次，计数在 Redis 里，多副本共享配额。
  # --------------------------------------------------------------------------
  gateway:
    profiles: ["full"]
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: mall-gateway
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      MALL_UPSTREAM: http://app:8080
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      GATEWAY_RATE_LIMIT: "200"
    ports:
      - "8081:8080"

  # --------------------------------------------------------------------------
  #  可观测性：Prometheus 抓指标，Grafana 出看板
  #  打开 http://localhost:3000（admin/admin），看板已自动装载
  # --------------------------------------------------------------------------
  prometheus:
    profiles: ["full"]
    image: prom/prometheus:v2.55.1
    container_name: mall-prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      app:
        condition: service_started

  grafana:
    profiles: ["full"]
    image: grafana/grafana:11.3.0
    container_name: mall-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  es-data:
  grafana-data:
