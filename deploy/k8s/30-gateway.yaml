# ============================================================================
#  API 网关
#
#  网关是唯一对外的入口：Service 类型用 LoadBalancer / 或由 Ingress 转发到它。
#  业务服务的 Service 保持 ClusterIP，不直接暴露。
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mall-gateway
  namespace: mall
  labels:
    app: mall-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mall-gateway
  template:
    metadata:
      labels:
        app: mall-gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/adfddda/high-concurrency-mall-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # 集群内直接用 Service DNS，不需要注册中心
            - name: MALL_UPSTREAM
              value: "http://mall-app:8080"
            - name: REDIS_HOST
              value: "redis.mall.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: GATEWAY_RATE_LIMIT
              value: "200"
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=70 -XX:+UseZGC"
          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: mall-gateway
  namespace: mall
  labels:
    app: mall-gateway
spec:
  type: ClusterIP
  selector:
    app: mall-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
